name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates the tag v<version> on the chosen branch)"
        required: true
      notes:
        description: "What's new, in a sentence or two. The family build shows it in its Update available sheet."
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then NAME="$VERSION_INPUT"; else NAME="${GITHUB_REF_NAME#v}"; fi
          case "$NAME" in *[!0-9.]*|"") echo "::error::version must look like 0.1.0"; exit 1;; esac
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "TAG=v$NAME" >> "$GITHUB_ENV"
          echo "CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      # Two builds (docs/distribution.md): github, the family APK that updates itself from these
      # releases, and play, the bundle for Google Play with no INTERNET permission.
      - name: Test and build
        run: >
          ./gradlew --no-daemon
          :app:testGithubDebugUnitTest :app:testPlayDebugUnitTest
          :app:assembleGithubRelease :app:bundlePlayRelease
          -PappVersionName="$NAME" -PappVersionCode="$CODE"
      # A full release (not a pre-release), so installed family builds offer it; SHA256SUMS.txt is
      # required, since self-update installs nothing whose checksum it can't match.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "cochilo-$NAME.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "cochilo-play-$NAME.aab"
          sha256sum "cochilo-$NAME.apk" "cochilo-play-$NAME.aab" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          NOTES="${NOTES_INPUT:-Cochilo $NAME.}"
          printf '%s\n\nInstall cochilo-%s.apk on the phone (allow installs from this source); after that, the app offers each new version itself. cochilo-play-%s.aab is the Google Play build, without internet access. The baby'"'"'s data stays on the phone.\n' "$NOTES" "$NAME" "$NAME" > notes.md
          gh release create "$TAG" "cochilo-$NAME.apk" "cochilo-play-$NAME.aab" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Cochilo $NAME" --latest --notes-file notes.md
