name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates the tag v<version> on the chosen branch)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then NAME="$VERSION_INPUT"; else NAME="${GITHUB_REF_NAME#v}"; fi
          case "$NAME" in *[!0-9.]*|"") echo "::error::version must look like 0.1.0"; exit 1;; esac
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "TAG=v$NAME" >> "$GITHUB_ENV"
          echo "CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PappVersionName="$NAME" -PappVersionCode="$CODE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "cochilo-$NAME.apk"
          gh release create "$TAG" "cochilo-$NAME.apk" --target "$GITHUB_SHA" \
            --title "Cochilo $NAME" --prerelease \
            --notes "Test build for the family. Install cochilo-$NAME.apk on the phone (allow installs from this source). Data stays on the phone; use Settings › Export backup before uninstalling."
