name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PappVersionName="$NAME" -PappVersionCode="$CODE"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "cochilo-$NAME.apk"
          gh release create "$GITHUB_REF_NAME" "cochilo-$NAME.apk" \
            --title "Cochilo $NAME" --prerelease \
            --notes "Test build for the family. Install cochilo-$NAME.apk on the phone (allow installs from this source). Data stays on the phone; use Settings › Export backup before uninstalling."
