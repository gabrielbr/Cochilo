name: Publish assistant model
# Puts Ask Cochilo's on-device model on a pre-release of this repository (docs/assistant.md), once,
# so the family build can download it with one tap and the Release workflow can fill the Play
# asset pack without Hugging Face. A pre-release, so the family build's self-update (which reads
# only the latest full release) never offers it as an update.
#
# Needs the HF_TOKEN secret: a Hugging Face read token from an account that accepted the Gemma
# terms on https://huggingface.co/litert-community/Gemma3-1B-IT (and, for Gemma 3n, on
# https://huggingface.co/google/gemma-3n-E2B-it-litert-lm). Gemma is redistributed under the
# Gemma Terms of Use, which ship beside it as GEMMA-NOTICE.txt.
#
# Since 0.55.0 it also publishes the 1B for LiteRT-LM (.litertlm) and, when asked, Gemma 3n E2B,
# which is over GitHub's 2 GB per file: it goes up in two parts, with the whole file's .sha256
# (ModelDownload.Choice).
on:
  workflow_dispatch:
    inputs:
      gemma3n:
        description: "Also publish Gemma 3n E2B (3.7 GB, for phones with 8 GB of memory)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  TAG: assistant-model-v1
  FILE: gemma3-1b-it-int4.task
  SOURCE: https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4.task
  LITERT: gemma3-1b-it-int4.litertlm
  LITERT_SOURCE: https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm
  NANO: gemma-3n-E2B-it-int4.litertlm
  NANO_SOURCE: https://huggingface.co/google/gemma-3n-E2B-it-litert-lm/resolve/main/gemma-3n-E2B-it-int4.litertlm
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Set the HF_TOKEN secret (a read token from an account that accepted the Gemma terms)."; exit 1; fi
          curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$FILE" "$SOURCE"
          # Google's current .task isn't a zip, so only rule out a text answer (an error page) and a short file.
          echo "First bytes:"; head -c 16 "$FILE" | od -An -tx1 -c
          case "$(head -c 1 "$FILE")" in "<"|"{"|"[") echo "::error::Hugging Face sent text, not the model"; exit 1;; esac
          [ "$(stat -c %s "$FILE")" -gt 100000000 ] || { echo "::error::The file is too small to be the model"; exit 1; }
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"; ls -la "$FILE"
          # The 1B for LiteRT-LM (0.55.0): its file starts with "LITERTLM".
          curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$LITERT" "$LITERT_SOURCE"
          [ "$(head -c 8 "$LITERT")" = "LITERTLM" ] || { echo "::error::$LITERT isn't a LiteRT-LM file"; exit 1; }
          sha256sum "$LITERT" > "$LITERT.sha256"; cat "$LITERT.sha256"
          echo "ASSETS=$FILE $FILE.sha256 $LITERT $LITERT.sha256" >> "$GITHUB_ENV"
          cat > GEMMA-NOTICE.txt <<'NOTICE'
          Gemma is provided under and subject to the Gemma Terms of Use found at ai.google.dev/gemma/terms.
          Use of Gemma is subject to the Gemma Prohibited Use Policy at ai.google.dev/gemma/prohibited_use_policy.
          Models, unmodified: litert-community/Gemma3-1B-IT (gemma3-1b-it-int4.task; Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm, published as gemma3-1b-it-int4.litertlm); google/gemma-3n-E2B-it-litert-lm (gemma-3n-E2B-it-int4.litertlm, in two parts joined by the app), when published.
          NOTICE
      - name: Gemma 3n, in two parts
        if: ${{ inputs.gemma3n }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$NANO" "$NANO_SOURCE"
          [ "$(head -c 8 "$NANO")" = "LITERTLM" ] || { echo "::error::$NANO isn't a LiteRT-LM file"; exit 1; }
          sha256sum "$NANO" > "$NANO.sha256"; cat "$NANO.sha256"
          # GitHub takes at most 2 GB per file: two parts the app joins, checked as one.
          # split names them .part0 and .part1; the app asks for .part1 and .part2.
          split -b 1900M -d -a 1 "$NANO" "$NANO.part"
          [ -f "$NANO.part1" ] && [ ! -f "$NANO.part2" ] || { echo "::error::expected exactly two parts"; exit 1; }
          mv "$NANO.part1" "$NANO.part2"; mv "$NANO.part0" "$NANO.part1"
          ls -la "$NANO".part*
          cat "$NANO.part1" "$NANO.part2" | sha256sum | grep -q "$(cut -d' ' -f1 "$NANO.sha256")" || { echo "::error::the parts don't join back"; exit 1; }
          echo "ASSETS=$ASSETS $NANO.part1 $NANO.part2 $NANO.sha256" >> "$GITHUB_ENV"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS GEMMA-NOTICE.txt --clobber
          else
            gh release create "$TAG" $ASSETS GEMMA-NOTICE.txt --prerelease \
              --title "Ask Cochilo model (Gemma 3 1B)" \
              --notes "The on-device model the family build downloads for Ask Cochilo. Not an app release. Gemma is provided under and subject to the Gemma Terms of Use (ai.google.dev/gemma/terms)."
          fi
